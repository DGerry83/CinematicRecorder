	+PART[LaunchPadLamp]:NEEDS[HullCameraVDS,TrackingLights]
    {
        @name = LaunchPadTrackingCam
        @title = Launch Tracking Camera

        MODULE
	    {
            name = MuMechModuleHullCameraZoom
            cameraName = Tracking KerbPro
            cameraTransformName = LightCan
            cameraForward = 0, 0, 1
            cameraUp = 0, 1, 0
            cameraPosition = 0.0, 0.0, 0.5
            cameraFoVMax = 120
            cameraFoVMin = 0.1
	    }
        MODULE
        {
            name = NoiseMaker
        }
    }
	
	