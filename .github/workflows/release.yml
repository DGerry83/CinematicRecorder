name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage readme and license
        # These two are gitignored in GameData (generated by the csproj
        # CopyTextFiles target on local builds) so restore them here.
        run: |
          cp README.md GameData/CinematicRecorder/Readme.txt
          cp LICENSE.txt GameData/CinematicRecorder/License.txt

      - name: Zip GameData
        run: zip -r "CinematicRecorder-${{ github.ref_name }}.zip" GameData

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: "CinematicRecorder-${{ github.ref_name }}.zip"
          generate_release_notes: true
          # Prepended to the auto-generated notes.
          body: |
            ### Acknowledgements

            Huge thanks to [@Halbann](https://github.com/Halbann), who reorganised this repository to follow KSP modding standards — KSPBuildTools-based build, SDK-style csproj, and the split C#/native projects — and smoothed out the build process.
          prerelease: ${{ contains(github.ref_name, '-') }}
